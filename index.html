<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실적 관리 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --surface2: #f2f0ec;
    --border: #e4e1da;
    --border2: #d0cdc5;
    --text: #1a1917;
    --text2: #6b6860;
    --text3: #9e9b95;
    --accent: #1a5276;
    --accent-bg: #eaf0f6;
    --pos: #0e6b50;
    --pos-bg: #e2f4ed;
    --neg: #9b3a1c;
    --neg-bg: #faeae4;
    --neu-bg: #f2f0ec;
    --radius: 8px;
    --radius-lg: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── 레이아웃 ── */
  .page { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .topbar-left h1 {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.02em;
  }
  .topbar-left p { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .topbar-right { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* ── 버튼 ── */
  .btn {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: background .15s, border-color .15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface2); border-color: var(--border2); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: #154567; }

  /* ── CSV 구조 안내 ── */
  .struct-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .struct-card h3 { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
  .struct-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .struct-item { background: var(--surface2); border-radius: var(--radius); padding: 10px 12px; }
  .struct-item .si-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
  .struct-item code { font-family: 'Courier New', monospace; font-size: 12px; color: var(--accent); background: var(--accent-bg); border-radius: 4px; padding: 1px 5px; }

  /* ── 접미사 설정 ── */
  .config-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 20px;
    margin-bottom: 20px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
    box-shadow: var(--shadow);
  }
  .config-bar .cfg-label { font-size: 12px; color: var(--text2); font-weight: 500; }
  .config-group { display: flex; align-items: center; gap: 6px; }
  .config-group label { font-size: 11px; color: var(--text3); }
  .config-group input {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    padding: 5px 9px;
    border-radius: var(--radius);
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    width: 100px;
  }
  .config-group input:focus { outline: none; border-color: var(--accent); background: var(--surface); }

  /* ── 업로드 존 ── */
  .upload-zone {
    background: var(--surface);
    border: 2px dashed var(--border2);
    border-radius: var(--radius-lg);
    padding: 36px;
    text-align: center;
    cursor: pointer;
    margin-bottom: 20px;
    transition: border-color .2s, background .2s;
  }
  .upload-zone:hover, .upload-zone.dragover { border-color: var(--accent); background: var(--accent-bg); }
  .upload-zone.loaded { border-color: var(--pos); border-style: solid; background: var(--pos-bg); }
  .upload-zone .uz-icon { font-size: 32px; margin-bottom: 10px; }
  .upload-zone .uz-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .upload-zone .uz-sub { font-size: 12px; color: var(--text2); }

  /* ── 대시보드 ── */
  #dashboard { display: none; }
  #dashboard.visible { display: block; }

  .info-strip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 16px;
    margin-bottom: 20px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: center;
    font-size: 12px;
    color: var(--text2);
    box-shadow: var(--shadow);
  }
  .info-strip .tag { font-weight: 600; color: var(--text); }
  .info-strip .divider { color: var(--border2); }

  /* ── 월 스트립 ── */
  .month-strip { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
  .month-strip::-webkit-scrollbar { height: 3px; }
  .month-strip::-webkit-scrollbar-track { background: transparent; }
  .month-strip::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
  .month-btn {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 5px 11px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    cursor: pointer;
    white-space: nowrap;
    transition: all .15s;
    min-width: 38px;
  }
  .month-btn:hover { border-color: var(--border2); color: var(--text); }
  .month-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ── 컨트롤 바 ── */
  .ctrl-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
  }
  .tabs { display: flex; gap: 4px; }
  .tab-btn {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    cursor: pointer;
    transition: all .15s;
  }
  .tab-btn:hover { background: var(--surface2); }
  .tab-btn.active { background: var(--text); color: #fff; border-color: var(--text); }

  .view-select {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }

  /* ── 그룹 필 ── */
  .group-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .gpill {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 11px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    cursor: pointer;
    transition: all .15s;
  }
  .gpill:hover { background: var(--surface2); }
  .gpill.active { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); font-weight: 600; }

  /* ── KPI 카드 ── */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .kpi-label { font-size: 11px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  .kpi-value { font-size: 22px; font-weight: 600; color: var(--text); margin-bottom: 8px; letter-spacing: -0.02em; }
  .kpi-rows { border-top: 1px solid var(--border); padding-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .kpi-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
  .kpi-row .kr-label { color: var(--text3); }
  .kpi-row .kr-val { font-weight: 600; }
  .kr-val.pos { color: var(--pos); }
  .kr-val.neg { color: var(--neg); }
  .kr-val.neu { color: var(--text3); }

  /* ── 카드 ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
  .card-head h2 { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; }
  .chart-select {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    padding: 5px 9px;
    border-radius: var(--radius);
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
  }

  /* ── 차트 범례 ── */
  .chart-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
  .chart-legend span { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text2); }
  .chart-legend i { display: inline-block; width: 24px; height: 3px; border-radius: 2px; }
  .chartbox { position: relative; height: 220px; }

  /* ── 테이블 ── */
  .tbl-wrap { overflow-x: auto; }
  .tbl-wrap::-webkit-scrollbar { height: 4px; }
  .tbl-wrap::-webkit-scrollbar-track { background: transparent; }
  .tbl-wrap::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    font-size: 11px;
    font-weight: 600;
    color: var(--text3);
    text-align: right;
    padding: 8px 10px;
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
    background: var(--surface2);
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  thead th:first-child { text-align: left; min-width: 120px; border-radius: var(--radius) 0 0 0; }
  thead th:last-child { border-radius: 0 var(--radius) 0 0; }
  tbody td {
    padding: 8px 10px;
    text-align: right;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    white-space: nowrap;
    font-size: 13px;
  }
  tbody td:first-child { text-align: left; font-weight: 500; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--surface2); }
  tbody tr.grp-header td {
    background: var(--surface2);
    font-size: 11px;
    color: var(--text2);
    font-weight: 600;
    padding: 5px 10px;
    text-transform: uppercase;
    letter-spacing: .04em;
    border-bottom: 1px solid var(--border);
  }
  tbody tr.row-subtotal td { background: var(--surface2); font-weight: 600; border-top: 1px solid var(--border2); }
  tbody tr.row-total td { font-weight: 700; border-top: 2px solid var(--border2); background: var(--surface); }
  .td-muted { color: var(--text3) !important; font-weight: 400 !important; }

  /* ── 뱃지 ── */
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 99px;
    white-space: nowrap;
  }
  .badge.pos { background: var(--pos-bg); color: var(--pos); }
  .badge.neg { background: var(--neg-bg); color: var(--neg); }
  .badge.neu { background: var(--neu-bg); color: var(--text3); }

  /* ── 반응형 ── */
  @media (max-width: 640px) {
    .page { padding: 16px 14px 40px; }
    .topbar { flex-direction: column; align-items: flex-start; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="page">

  <!-- 헤더 -->
  <div class="topbar">
    <div class="topbar-left">
      <h1>실적 관리 대시보드</h1>
      <p id="subTitle">CSV 파일을 업로드하면 대시보드가 자동으로 구성됩니다</p>
    </div>
    <div class="topbar-right">
      <button class="btn" id="btnDlTpl">↓ CSV 템플릿 다운로드</button>
      <button class="btn primary" id="btnUpload">↑ 파일 업로드</button>
      <input type="file" id="csvFile" accept=".csv" style="display:none">
    </div>
  </div>

  <!-- CSV 구조 안내 -->
  <div class="struct-card" id="structCard">
    <h3>CSV 파일 구조</h3>
    <div class="struct-grid">
      <div class="struct-item">
        <div class="si-label">필수 컬럼 (앞부분)</div>
        <code>그룹</code> &nbsp; <code>서비스명</code>
      </div>
      <div class="struct-item">
        <div class="si-label">데이터 컬럼 (1월~12월)</div>
        <code>1월</code> &nbsp; <code>2월</code> &nbsp; ··· &nbsp; <code>12월</code>
      </div>
      <div class="struct-item">
        <div class="si-label">서비스명 규칙 (접미사 포함)</div>
        <code>서비스A_매출</code> &nbsp; <code>서비스A_비용</code>
      </div>
      <div class="struct-item">
        <div class="si-label">전년 데이터 (선택)</div>
        <code>서비스A_매출(전년)</code> &nbsp; <code>서비스A_비용(전년)</code>
      </div>
    </div>
  </div>

  <!-- 접미사 설정 -->
  <div class="config-bar">
    <span class="cfg-label">접미사 설정</span>
    <div class="config-group"><label>매출</label><input id="sfRev" value="_매출"></div>
    <div class="config-group"><label>비용</label><input id="sfCost" value="_비용"></div>
    <div class="config-group"><label>전년</label><input id="sfPrev" value="(전년)"></div>
    <button class="btn" id="btnApply">적용</button>
  </div>

  <!-- 업로드 존 -->
  <div class="upload-zone" id="uploadZone">
    <div class="uz-icon">📂</div>
    <div class="uz-title" id="uzTitle">CSV 파일을 드래그하거나 클릭하여 업로드</div>
    <div class="uz-sub" id="uzSub">또는 상단의 CSV 템플릿을 먼저 다운로드해 작성하세요</div>
  </div>

  <!-- 대시보드 -->
  <div id="dashboard">

    <div class="info-strip" id="infoStrip"></div>

    <div class="month-strip" id="monthStrip"></div>

    <div class="ctrl-bar">
      <div class="tabs" id="metricTabs">
        <button class="tab-btn active" data-m="revenue">매출</button>
        <button class="tab-btn" data-m="cost">비용</button>
        <button class="tab-btn" data-m="profit">손익</button>
        <button class="tab-btn" data-m="all">통합</button>
      </div>
      <select class="view-select" id="viewMode">
        <option value="month">월별</option>
        <option value="ytd">누계 YTD</option>
      </select>
    </div>

    <div class="group-pills" id="groupPills"></div>

    <div class="kpi-grid" id="kpiGrid"></div>

    <div class="card">
      <div class="card-head">
        <h2 id="chartLabel">매출 월별 추이</h2>
        <select class="chart-select" id="chartSvc"></select>
      </div>
      <div class="chart-legend" id="chartLegend"></div>
      <div class="chartbox">
        <canvas id="trendChart" role="img" aria-label="월별 실적 추이 차트"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2 id="tblLabel">서비스별 상세 실적</h2></div>
      <div class="tbl-wrap"><table id="mainTable"></table></div>
    </div>

  </div><!-- /dashboard -->
</div><!-- /page -->

<script>
const MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

let CFG = { sfRev: '_매출', sfCost: '_비용', sfPrev: '(전년)' };
let S = { month: new Date().getMonth() + 1, metric: 'revenue', group: 'all', view: 'month' };
let DB = { rev:{}, cost:{}, revP:{}, costP:{}, svcs:[], grps:{} };
let chartInst = null;

// ── 유틸 ──
const fmt = v => (v === null || v === undefined || isNaN(v)) ? '-' : (v < 0 ? '-' : '') + Math.abs(Math.round(v)).toLocaleString('ko-KR');
const pct = (a, b) => (!b || isNaN(b) || isNaN(a)) ? null : (a - b) / Math.abs(b) * 100;
const fmtP = p => p === null ? '—' : (p >= 0 ? '+' : '') + p.toFixed(1) + '%';
const bc = p => p === null ? 'neu' : p >= 0 ? 'pos' : 'neg';

// ── 서비스명 파싱 ──
function parseName(raw) {
  const isPrev = raw.includes(CFG.sfPrev);
  const base = raw.replace(CFG.sfPrev, '');
  let type = null, svcName = null;
  if (base.endsWith(CFG.sfRev))  { type = 'rev';  svcName = base.slice(0, -CFG.sfRev.length); }
  else if (base.endsWith(CFG.sfCost)) { type = 'cost'; svcName = base.slice(0, -CFG.sfCost.length); }
  return { svcName, type, isPrev };
}

// ── CSV 파싱 ──
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const hdr = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
  const grpIdx  = hdr.findIndex(h => ['그룹','group','구분'].includes(h));
  const svcIdx  = hdr.findIndex(h => ['서비스명','service','서비스','항목','이름'].includes(h));
  const mStart  = Math.max(grpIdx, svcIdx) + 1;
  DB = { rev:{}, cost:{}, revP:{}, costP:{}, svcs:[], grps:{} };

  lines.slice(1).forEach(line => {
    if (!line.trim()) return;
    const cols = line.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
    const grp     = grpIdx >= 0 ? (cols[grpIdx] || '기타') : '기타';
    const rawName = svcIdx >= 0 ? cols[svcIdx] : '';
    if (!rawName) return;
    const vals = cols.slice(mStart).map(v => parseFloat(v) || 0);
    const { svcName, type, isPrev } = parseName(rawName);
    if (!svcName || !type) return;
    const target = type === 'rev' ? (isPrev ? DB.revP : DB.rev) : (isPrev ? DB.costP : DB.cost);
    target[svcName] = { grp, vals };
    if (!isPrev && !DB.svcs.includes(svcName)) DB.svcs.push(svcName);
    if (!isPrev) {
      if (!DB.grps[grp]) DB.grps[grp] = [];
      if (!DB.grps[grp].includes(svcName)) DB.grps[grp].push(svcName);
    }
  });
}

// ── 집계 ──
function getV(svc, mi, m) {
  const ra = DB.rev[svc]?.vals[mi] ?? 0;
  const ca = DB.cost[svc]?.vals[mi] ?? 0;
  const rp = DB.revP[svc]?.vals[mi] ?? null;
  const cp = DB.costP[svc]?.vals[mi] ?? null;
  if (m === 'revenue') return { act: ra, prev: rp };
  if (m === 'cost')    return { act: ca, prev: cp };
  return { act: ra - ca, prev: (rp !== null && cp !== null) ? rp - cp : null };
}
function agg(svcs, mi, m) {
  let act = 0, prev = 0, hp = false;
  svcs.forEach(s => { const v = getV(s, mi, m); act += v.act; if (v.prev !== null) { prev += v.prev; hp = true; } });
  return { act, prev: hp ? prev : null };
}
function aggYTD(svcs, upTo, m) {
  let act = 0, prev = 0, hp = false;
  for (let i = 0; i <= upTo; i++) { const v = agg(svcs, i, m); act += v.act; if (v.prev !== null) { prev += v.prev; hp = true; } }
  return { act, prev: hp ? prev : null };
}
function getSvcs() { return S.group === 'all' ? DB.svcs : (DB.grps[S.group] || []); }
function getAgg(svcs, mi, m) { return S.view === 'ytd' ? aggYTD(svcs, mi, m) : agg(svcs, mi, m); }

// ── UI 빌더 ──
function buildInfoStrip(label) {
  const hasPrev = Object.keys(DB.revP).length > 0 || Object.keys(DB.costP).length > 0;
  document.getElementById('infoStrip').innerHTML =
    `<span class="tag">${label}</span><span class="divider">|</span>` +
    `서비스 <strong>${DB.svcs.length}개</strong><span class="divider">|</span>` +
    `그룹 <strong>${Object.keys(DB.grps).length}개</strong><span class="divider">|</span>` +
    `전년 데이터 <strong>${hasPrev ? '✓ 포함' : '없음'}</strong>`;
}

function buildMonthStrip() {
  document.getElementById('monthStrip').innerHTML = MONTHS.map((m, i) =>
    `<button class="month-btn${i + 1 === S.month ? ' active' : ''}" data-mi="${i + 1}">${m}</button>`
  ).join('');
  document.querySelectorAll('.month-btn').forEach(b =>
    b.addEventListener('click', () => { S.month = +b.dataset.mi; render(); })
  );
}

function buildGroupPills() {
  const el = document.getElementById('groupPills');
  let h = `<button class="gpill active" data-g="all">전체 (${DB.svcs.length}개)</button>`;
  Object.keys(DB.grps).forEach(g => { h += `<button class="gpill" data-g="${g}">${g} (${DB.grps[g].length}개)</button>`; });
  el.innerHTML = h;
  el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    el.querySelectorAll('button').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); S.group = b.dataset.g; render();
  }));
}

function buildKPI() {
  const svcs = getSvcs(); const mi = S.month - 1;
  const ms = S.metric === 'all' ? ['revenue','cost','profit'] : [S.metric];
  const ml = { revenue:'매출', cost:'비용', profit:'손익' };
  document.getElementById('kpiGrid').innerHTML = ms.map(m => {
    const cur = getAgg(svcs, mi, m);
    const py = pct(cur.act, cur.prev);
    const lbl = S.view === 'ytd' ? `${ml[m]} 누계 1~${S.month}월` : `${ml[m]} ${S.month}월`;
    return `<div class="kpi-card">
      <div class="kpi-label">${lbl}</div>
      <div class="kpi-value">${fmt(cur.act)}</div>
      <div class="kpi-rows">
        <div class="kpi-row"><span class="kr-label">전년 동기비</span><span class="kr-val ${bc(py)}">${fmtP(py)}</span></div>
        <div class="kpi-row"><span class="kr-label">전년 실적</span><span class="kr-val neu">${fmt(cur.prev)}</span></div>
      </div>
    </div>`;
  }).join('');
}

function buildChart() {
  const svcs = getSvcs();
  const m = S.metric === 'all' ? 'revenue' : S.metric;
  const ml = { revenue:'매출', cost:'비용', profit:'손익' };
  document.getElementById('chartLabel').textContent = `${ml[m]} ${S.view === 'ytd' ? '누계 추이' : '월별 추이'}`;

  const sel = document.getElementById('chartSvc');
  const prev = sel.value;
  sel.innerHTML = `<option value="__all__">전체 합산</option>` + svcs.map(s => `<option value="${s}">${s}</option>`).join('');
  if (svcs.includes(prev)) sel.value = prev;
  const tgt = sel.value === '__all__' ? null : sel.value;

  const actData  = MONTHS.map((_, i) => tgt ? getAgg([tgt], i, m).act  : getAgg(svcs, i, m).act);
  const prevData = MONTHS.map((_, i) => tgt ? getAgg([tgt], i, m).prev : getAgg(svcs, i, m).prev);
  const hasPrev  = prevData.some(v => v !== null);

  document.getElementById('chartLegend').innerHTML =
    `<span><i style="background:#1a5276;height:3px"></i>올해 실적</span>` +
    (hasPrev ? `<span><i style="background:#c0392b;height:2px;opacity:.7"></i>전년 실적</span>` : '');

  const ctx = document.getElementById('trendChart').getContext('2d');
  if (chartInst) chartInst.destroy();
  const datasets = [
    { label:'올해', data:actData, borderColor:'#1a5276', backgroundColor:'#1a527618', tension:.35, fill:true, pointRadius:3, borderWidth:2, pointHoverRadius:5 }
  ];
  if (hasPrev) datasets.push(
    { label:'전년', data:prevData, borderColor:'#c0392b', borderDash:[4,3], tension:.35, fill:false, pointRadius:0, borderWidth:1.5, pointHoverRadius:4 }
  );
  chartInst = new Chart(ctx, {
    type: 'line',
    data: { labels: MONTHS, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmt(c.raw)}` } } },
      scales: {
        y: { ticks: { callback: v => fmt(v), font: { size: 11 } }, grid: { color: 'rgba(0,0,0,0.05)' } },
        x: { ticks: { autoSkip: false, maxRotation: 0, font: { size: 11 } } }
      }
    }
  });
}

function buildTable() {
  const svcs = getSvcs(); const mi = S.month - 1;
  const ms = S.metric === 'all' ? ['revenue','cost','profit'] : [S.metric];
  const ml = { revenue:'매출', cost:'비용', profit:'손익' };
  document.getElementById('tblLabel').textContent = `서비스별 실적 — ${S.view === 'ytd' ? `1~${S.month}월 누계` : `${S.month}월`}`;

  let hdr = `<thead><tr><th>서비스</th>`;
  ms.forEach(m => { hdr += `<th>${ml[m]}</th><th>전년</th><th>전년비</th>`; });
  hdr += `</tr></thead>`;

  const grps = S.group === 'all' ? Object.keys(DB.grps) : [S.group];
  let body = '<tbody>';
  let grand = {}; ms.forEach(m => { grand[m] = { act:0, prev:0, hp:false }; });

  grps.forEach(g => {
    const gs = svcs.filter(s => (DB.grps[g] || []).includes(s));
    if (!gs.length) return;
    if (S.group === 'all') body += `<tr class="grp-header"><td colspan="${1 + ms.length * 3}">${g}</td></tr>`;
    let sub = {}; ms.forEach(m => { sub[m] = { act:0, prev:0, hp:false }; });

    gs.forEach(s => {
      let row = `<tr><td>${s}</td>`;
      ms.forEach(m => {
        const v = getAgg([s], mi, m);
        const py = pct(v.act, v.prev);
        sub[m].act += v.act;
        if (v.prev !== null) { sub[m].prev += v.prev; sub[m].hp = true; }
        row += `<td>${fmt(v.act)}</td><td class="td-muted">${fmt(v.prev)}</td><td><span class="badge ${bc(py)}">${fmtP(py)}</span></td>`;
      });
      row += `</tr>`; body += row;
    });

    if (S.group === 'all') {
      let sr = `<tr class="row-subtotal"><td>${g} 소계</td>`;
      ms.forEach(m => {
        const py = sub[m].hp ? pct(sub[m].act, sub[m].prev) : null;
        grand[m].act += sub[m].act;
        if (sub[m].hp) { grand[m].prev += sub[m].prev; grand[m].hp = true; }
        sr += `<td>${fmt(sub[m].act)}</td><td class="td-muted">${fmt(sub[m].prev)}</td><td><span class="badge ${bc(py)}">${fmtP(py)}</span></td>`;
      });
      body += sr + `</tr>`;
    }
  });

  const gt = S.group === 'all' ? grand : (() => {
    let t = {}; ms.forEach(m => { const v = getAgg(svcs, mi, m); t[m] = { act:v.act, prev:v.prev??0, hp:v.prev!==null }; }); return t;
  })();
  let tr = `<tr class="row-total"><td>전체 합계</td>`;
  ms.forEach(m => {
    const py = gt[m].hp ? pct(gt[m].act, gt[m].prev) : null;
    tr += `<td>${fmt(gt[m].act)}</td><td class="td-muted">${fmt(gt[m].prev)}</td><td><span class="badge ${bc(py)}">${fmtP(py)}</span></td>`;
  });
  body += tr + `</tr></tbody>`;
  document.getElementById('mainTable').innerHTML = hdr + body;
}

// ── 렌더 ──
function render() { buildMonthStrip(); buildKPI(); buildChart(); buildTable(); }

function showDashboard(label) {
  document.getElementById('structCard').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('subTitle').textContent = label;
  buildInfoStrip(label);
  buildGroupPills();
  render();
}

// ── 템플릿 생성 ──
function makeTemplate() {
  const svcs = [['그룹1','서비스A'],['그룹1','서비스B'],['그룹1','서비스C'],['그룹2','서비스D'],['그룹2','서비스E'],['그룹2','서비스F']];
  const sf = CFG;
  const header = '그룹,서비스명,' + MONTHS.map((_, i) => `${i+1}월`).join(',');
  const rows = [header];
  svcs.forEach(([g, s]) => {
    const base = (s.charCodeAt(3) - 64) * 300 + 200;
    const rv  = MONTHS.map((_, i) => Math.round(base + i * 15 + Math.random() * 80 - 30));
    const cv  = rv.map(v => Math.round(v * 0.72 + Math.random() * 30));
    const rvP = rv.map(v => Math.round(v * 0.88 + Math.random() * 40 - 20));
    const cvP = cv.map(v => Math.round(v * 0.9  + Math.random() * 20));
    rows.push(`${g},${s}${sf.sfRev},${rv.join(',')}`);
    rows.push(`${g},${s}${sf.sfCost},${cv.join(',')}`);
    rows.push(`${g},${s}${sf.sfRev}${sf.sfPrev},${rvP.join(',')}`);
    rows.push(`${g},${s}${sf.sfCost}${sf.sfPrev},${cvP.join(',')}`);
  });
  return rows.join('\n');
}

// ── 이벤트 바인딩 ──
document.getElementById('metricTabs').querySelectorAll('.tab-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); S.metric = b.dataset.m; render();
  });
});
document.getElementById('viewMode').addEventListener('change', e => { S.view = e.target.value; render(); });
document.getElementById('chartSvc').addEventListener('change', () => buildChart());

document.getElementById('btnApply').addEventListener('click', () => {
  CFG.sfRev  = document.getElementById('sfRev').value  || '_매출';
  CFG.sfCost = document.getElementById('sfCost').value || '_비용';
  CFG.sfPrev = document.getElementById('sfPrev').value || '(전년)';
});

document.getElementById('btnDlTpl').addEventListener('click', () => {
  const csv = makeTemplate();
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv);
  a.download = '실적_템플릿.csv'; a.click();
});

document.getElementById('btnUpload').addEventListener('click', () => document.getElementById('csvFile').click());
document.getElementById('uploadZone').addEventListener('click', () => document.getElementById('csvFile').click());

function loadFile(f) {
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      parseCSV(ev.target.result);
      document.getElementById('uploadZone').classList.add('loaded');
      document.getElementById('uzTitle').textContent = f.name + ' ✓ 로드 완료';
      document.getElementById('uzSub').textContent = `서비스 ${DB.svcs.length}개 · 그룹 ${Object.keys(DB.grps).length}개`;
      showDashboard(f.name);
    } catch (err) { alert('파싱 오류: ' + err.message); }
  };
  reader.readAsText(f, 'utf-8');
}

document.getElementById('csvFile').addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

const uz = document.getElementById('uploadZone');
uz.addEventListener('dragover',  e => { e.preventDefault(); uz.classList.add('dragover'); });
uz.addEventListener('dragleave', () => uz.classList.remove('dragover'));
uz.addEventListener('drop',      e => {
  e.preventDefault(); uz.classList.remove('dragover');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
</script>
</body>
